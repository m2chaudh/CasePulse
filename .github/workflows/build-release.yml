name: Build & Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Generate icons
        run: cd assets && python generate_icon.py && cp icon.icns icon.ico icon.png ..

      - name: Build with PyInstaller
        run: pyinstaller casepulse.spec --noconfirm

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "CasePulse" \
            --volicon "icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "CasePulse.app" 150 190 \
            --app-drop-link 450 190 \
            --no-internet-enable \
            "dist/CasePulse.dmg" \
            "dist/CasePulse.app"

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CasePulse.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-desktop.txt

      - name: Generate icons
        run: |
          cd assets
          python generate_icon.py
          copy icon.ico ..
          copy icon.png ..

      - name: Build with PyInstaller
        run: pyinstaller casepulse.spec --noconfirm

      - name: Create installer with Inno Setup
        run: iscc installer_win.iss

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CasePulse_Setup.exe
